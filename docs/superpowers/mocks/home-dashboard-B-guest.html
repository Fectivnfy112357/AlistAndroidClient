<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>首页 Mock B — 游客降级版</title>
<style>
  :root {
    --bg: #F7F5FA;
    --surface: #FFFFFF;
    --surface-strong: #EDE9F6;
    --primary: #5164F6;
    --primary-soft: #ECE8FF;
    --text-primary: #20212B;
    --text-secondary: #777482;
    --text-tertiary: #9B98A4;
    --info-container: #E6F1FF;
    --info-text: #1B4DA1;
    --info-icon: #2B58E0;
    --card-radius: 22px;
    --pill-radius: 999px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #EEEBF6 0%, #F7F5FA 100%);
    min-height: 100vh;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 380px;
    margin: 0 auto;
    background: var(--bg);
    border-radius: 36px;
    box-shadow: 0 30px 80px rgba(81, 100, 246, 0.12), 0 8px 24px rgba(0,0,0,0.06);
    overflow: hidden;
    border: 1px solid rgba(34, 34, 48, 0.12);
  }
  .statusbar { height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 13px; font-weight: 600; }
  .topbar { padding: 8px 16px 12px; display: flex; align-items: center; gap: 10px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--surface); font-size: 18px; }
  .topbar .titles { flex: 1; }
  .topbar .title { font-size: 17px; font-weight: 600; }
  .topbar .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .content { padding: 4px 16px 24px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 20px 4px 10px; letter-spacing: 0.4px; }

  .hero {
    background: linear-gradient(135deg, #6E7DF8 0%, #8E9BFB 100%);
    border-radius: var(--card-radius);
    padding: 22px 22px 20px;
    color: #fff;
    box-shadow: 0 16px 32px rgba(81, 100, 246, 0.20);
    position: relative;
    overflow: hidden;
  }
  .hero::before { content: ""; position: absolute; top: -40px; right: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,0.10); }
  .hero .label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.8; font-weight: 600; }
  .hero .server-name { font-size: 24px; font-weight: 700; margin: 6px 0 14px; position: relative; }
  .hero .meta { display: flex; gap: 8px; align-items: center; font-size: 12.5px; opacity: 0.92; position: relative; }
  .hero .pill { background: rgba(255,255,255,0.18); padding: 4px 10px; border-radius: var(--pill-radius); }
  .hero .pill-muted { background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: var(--pill-radius); opacity: 0.7; }

  /* Info banner (guest) */
  .banner-info {
    margin-top: 12px;
    background: var(--info-container);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .banner-info .ic {
    width: 28px; height: 28px;
    flex-shrink: 0;
    border-radius: 8px;
    background: rgba(43, 88, 224, 0.12);
    color: var(--info-icon);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }
  .banner-info .text { font-size: 12.5px; color: var(--info-text); line-height: 1.4; }
  .banner-info .text .title { font-weight: 600; margin-bottom: 2px; }

  /* placeholder list */
  .storage-empty {
    background: var(--surface);
    border-radius: var(--card-radius);
    padding: 32px 22px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 13px;
    box-shadow: 0 4px 14px rgba(34, 34, 48, 0.04);
  }
  .storage-empty .em { font-size: 30px; opacity: 0.5; margin-bottom: 8px; }

  .bottombar { display: flex; justify-content: space-around; padding: 8px 14px 18px; background: var(--bg); border-top: 1px solid rgba(34, 34, 48, 0.12); }
  .bb-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; border-radius: 14px; }
  .bb-icon { width: 46px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 999px; font-size: 16px; color: var(--text-secondary); }
  .bb-icon.selected { background: var(--primary-soft); color: var(--primary); }
  .bb-label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
  .bb-label.selected { color: var(--text-primary); font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span>●●●●● 5G ▰</span>
  </div>

  <div class="topbar">
    <div class="icon-btn">‹</div>
    <div class="titles">
      <div class="title">首页</div>
      <div class="subtitle">http://192.168.1.10:5244</div>
    </div>
    <div class="icon-btn">⟳</div>
  </div>

  <div class="content">
    <!-- HERO (lighter, no usage) -->
    <div class="hero">
      <div class="label">当前服务器</div>
      <div class="server-name">我的家庭云</div>
      <div class="meta">
        <span class="pill">v3.25.0</span>
        <span>·</span>
        <span class="pill-muted">运行时长 —</span>
      </div>
    </div>

    <!-- GUEST BANNER -->
    <div class="banner-info">
      <div class="ic">i</div>
      <div class="text">
        <div class="title">当前为游客身份</div>
        <div>存储详情不可用，请使用管理员账号登录以查看用量。</div>
      </div>
    </div>

    <!-- STORAGE LIST (empty placeholder) -->
    <div class="section-title">存储 (—)</div>
    <div class="storage-empty">
      <div class="em">▤</div>
      <div>暂无存储信息</div>
    </div>
  </div>

  <div class="bottombar">
    <div class="bb-item">
      <div class="bb-icon selected">⌂</div>
      <div class="bb-label selected">首页</div>
    </div>
    <div class="bb-item">
      <div class="bb-icon">▤</div>
      <div class="bb-label">文件</div>
    </div>
    <div class="bb-item">
      <div class="bb-icon">⇅</div>
      <div class="bb-label">传输</div>
    </div>
    <div class="bb-item">
      <div class="bb-icon">⚙</div>
      <div class="bb-label">设置</div>
    </div>
  </div>
</div>
</body>
</html>
