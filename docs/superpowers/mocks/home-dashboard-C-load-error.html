<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>首页 Mock C — 加载与错误态</title>
<style>
  :root {
    --bg: #F7F5FA;
    --surface: #FFFFFF;
    --surface-strong: #EDE9F6;
    --surface-muted: #F4F2F8;
    --primary: #5164F6;
    --primary-soft: #ECE8FF;
    --text-primary: #20212B;
    --text-secondary: #777482;
    --text-tertiary: #9B98A4;
    --error-container: #FFECEF;
    --error-text: #B4233B;
    --error-icon: #B4233B;
    --card-radius: 22px;
    --pill-radius: 999px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #EEEBF6 0%, #F7F5FA 100%);
    min-height: 100vh;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .row { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .phone {
    width: 380px;
    background: var(--bg);
    border-radius: 36px;
    box-shadow: 0 30px 80px rgba(81, 100, 246, 0.12), 0 8px 24px rgba(0,0,0,0.06);
    overflow: hidden;
    border: 1px solid rgba(34, 34, 48, 0.12);
  }
  .phone-label { text-align: center; font-size: 13px; color: var(--text-secondary); margin: 0 0 8px; font-weight: 600; letter-spacing: 0.5px; }
  .statusbar { height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 13px; font-weight: 600; }
  .topbar { padding: 8px 16px 12px; display: flex; align-items: center; gap: 10px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--surface); font-size: 18px; }
  .topbar .titles { flex: 1; }
  .topbar .title { font-size: 17px; font-weight: 600; }
  .topbar .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .content { padding: 4px 16px 24px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 20px 4px 10px; letter-spacing: 0.4px; }

  /* skeleton */
  .skel {
    background: linear-gradient(90deg, var(--surface) 0%, var(--surface-muted) 50%, var(--surface) 100%);
    background-size: 200% 100%;
    border-radius: 8px;
    animation: shimmer 1.6s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skel-card { background: var(--surface); border-radius: var(--card-radius); padding: 22px; box-shadow: 0 4px 14px rgba(34, 34, 48, 0.04); }
  .skel-hero {
    background: var(--surface);
    border-radius: var(--card-radius);
    padding: 22px;
    height: 130px;
    box-shadow: 0 4px 14px rgba(34, 34, 48, 0.04);
    display: flex; flex-direction: column; gap: 14px; justify-content: center;
  }
  .skel-card.small { padding: 16px 18px; }
  .skel-row { display: flex; gap: 10px; align-items: center; }
  .skel-circle { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; }
  .skel-bar { height: 12px; flex: 1; }
  .skel-bar.tiny { height: 8px; }

  /* Error banner */
  .banner-error {
    margin-top: 12px;
    background: var(--error-container);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .banner-error .ic {
    width: 32px; height: 32px;
    flex-shrink: 0;
    border-radius: 10px;
    background: rgba(180, 35, 59, 0.12);
    color: var(--error-icon);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    font-weight: 700;
  }
  .banner-error .text { flex: 1; font-size: 13px; color: var(--error-text); line-height: 1.4; font-weight: 500; }
  .banner-error .btn {
    flex-shrink: 0;
    background: var(--error-text);
    color: #fff;
    padding: 6px 14px;
    border-radius: var(--pill-radius);
    font-size: 12px;
    font-weight: 600;
  }

  .bottombar { display: flex; justify-content: space-around; padding: 8px 14px 18px; background: var(--bg); border-top: 1px solid rgba(34, 34, 48, 0.12); }
  .bb-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; border-radius: 14px; }
  .bb-icon { width: 46px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 999px; font-size: 16px; color: var(--text-secondary); }
  .bb-icon.selected { background: var(--primary-soft); color: var(--primary); }
  .bb-label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
  .bb-label.selected { color: var(--text-primary); font-weight: 600; }
</style>
</head>
<body>
<div class="row">

  <!-- LEFT: LOADING SKELETON -->
  <div>
    <div class="phone-label">C-1 加载骨架（首次进入）</div>
    <div class="phone">
      <div class="statusbar"><span>9:41</span><span>●●●●● 5G ▰</span></div>
      <div class="topbar">
        <div class="icon-btn">‹</div>
        <div class="titles"><div class="title">首页</div><div class="subtitle">http://192.168.1.10:5244</div></div>
        <div class="icon-btn">⟳</div>
      </div>
      <div class="content">
        <div class="skel-hero">
          <div class="skel skel-bar" style="width:40%;height:14px;"></div>
          <div class="skel skel-bar" style="width:75%;height:28px;"></div>
          <div class="skel skel-bar" style="width:50%;height:12px;"></div>
        </div>
        <div class="section-title">总用量</div>
        <div class="skel-card small">
          <div class="skel skel-bar tiny" style="width:100%;"></div>
          <div style="height:10px"></div>
          <div class="skel skel-bar tiny" style="width:60%;"></div>
        </div>
        <div class="section-title">存储 (—)</div>
        <div class="skel-card small">
          <div class="skel-row">
            <div class="skel skel-circle"></div>
            <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
              <div class="skel skel-bar" style="width:40%;"></div>
              <div class="skel skel-bar" style="width:70%;height:10px;"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="bottombar">
        <div class="bb-item"><div class="bb-icon selected">⌂</div><div class="bb-label selected">首页</div></div>
        <div class="bb-item"><div class="bb-icon">▤</div><div class="bb-label">文件</div></div>
        <div class="bb-item"><div class="bb-icon">⇅</div><div class="bb-label">传输</div></div>
        <div class="bb-item"><div class="bb-icon">⚙</div><div class="bb-label">设置</div></div>
      </div>
    </div>
  </div>

  <!-- RIGHT: ERROR STATE -->
  <div>
    <div class="phone-label">C-2 错误态（public 也失败）</div>
    <div class="phone">
      <div class="statusbar"><span>9:41</span><span>● 离线</span></div>
      <div class="topbar">
        <div class="icon-btn">‹</div>
        <div class="titles"><div class="title">首页</div><div class="subtitle">http://192.168.1.10:5244</div></div>
        <div class="icon-btn">⟳</div>
      </div>
      <div class="content">
        <div class="skel-hero" style="opacity:0.5;">
          <div class="skel skel-bar" style="width:40%;height:14px;"></div>
          <div class="skel skel-bar" style="width:60%;height:28px;"></div>
          <div class="skel skel-bar" style="width:50%;height:12px;"></div>
        </div>
        <div class="banner-error">
          <div class="ic">!</div>
          <div class="text">无法连接到服务器<br><span style="color:#888;font-weight:400;font-size:12px;">请检查网络或服务器状态</span></div>
          <div class="btn">重试</div>
        </div>
        <div class="section-title">总用量</div>
        <div class="skel-card small" style="opacity:0.5;">
          <div class="skel skel-bar tiny" style="width:100%;"></div>
          <div style="height:10px"></div>
          <div class="skel skel-bar tiny" style="width:60%;"></div>
        </div>
      </div>
      <div class="bottombar">
        <div class="bb-item"><div class="bb-icon selected">⌂</div><div class="bb-label selected">首页</div></div>
        <div class="bb-item"><div class="bb-icon">▤</div><div class="bb-label">文件</div></div>
        <div class="bb-item"><div class="bb-icon">⇅</div><div class="bb-label">传输</div></div>
        <div class="bb-item"><div class="bb-icon">⚙</div><div class="bb-label">设置</div></div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
