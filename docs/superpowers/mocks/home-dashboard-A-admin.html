<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>首页 Mock A — 完整版（admin 视角）</title>
<style>
  :root {
    --bg: #F7F5FA;
    --bg-deep: #F0EDF6;
    --surface: #FFFFFF;
    --surface-muted: #F4F2F8;
    --surface-strong: #EDE9F6;
    --outline: rgba(34, 34, 48, 0.12);
    --primary: #5164F6;
    --primary-dark: #2532A8;
    --primary-soft: #ECE8FF;
    --on-primary: #FFFFFF;
    --text-primary: #20212B;
    --text-secondary: #777482;
    --text-tertiary: #9B98A4;
    --success-container: #EAF8EF;
    --success-text: #247A3D;
    --warning-container: #FFF4DF;
    --warning-text: #8A520D;
    --error-container: #FFECEF;
    --error-text: #B4233B;
    --folder-tint: #EDE8FF;
    --folder-icon: #2E254A;
    --card-radius: 22px;
    --pill-radius: 999px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #EEEBF6 0%, #F7F5FA 100%);
    min-height: 100vh;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 380px;
    margin: 0 auto;
    background: var(--bg);
    border-radius: 36px;
    box-shadow: 0 30px 80px rgba(81, 100, 246, 0.12), 0 8px 24px rgba(0,0,0,0.06);
    overflow: hidden;
    border: 1px solid var(--outline);
  }
  /* status bar */
  .statusbar {
    height: 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 28px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    background: transparent;
  }
  /* top bar */
  .topbar {
    padding: 8px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar .icon-btn {
    width: 38px; height: 38px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface);
    color: var(--text-primary);
    font-size: 18px;
  }
  .topbar .titles { flex: 1; }
  .topbar .title { font-size: 17px; font-weight: 600; color: var(--text-primary); }
  .topbar .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .topbar .right-icon {
    width: 38px; height: 38px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 18px;
  }
  /* content */
  .content { padding: 4px 16px 24px; }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin: 20px 4px 10px;
    letter-spacing: 0.4px;
  }
  /* Hero card */
  .hero {
    background: linear-gradient(135deg, #5164F6 0%, #6E7DF8 60%, #8E9BFB 100%);
    border-radius: var(--card-radius);
    padding: 22px 22px 20px;
    color: var(--on-primary);
    box-shadow: 0 16px 32px rgba(81, 100, 246, 0.25);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
  }
  .hero::after {
    content: "";
    position: absolute;
    bottom: -60px; left: -30px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .hero .label {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.8;
    font-weight: 600;
  }
  .hero .server-name {
    font-size: 24px;
    font-weight: 700;
    margin: 6px 0 14px;
    position: relative;
  }
  .hero .meta {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12.5px;
    opacity: 0.92;
    position: relative;
  }
  .hero .pill {
    background: rgba(255,255,255,0.18);
    padding: 4px 10px;
    border-radius: var(--pill-radius);
    backdrop-filter: blur(8px);
  }
  /* Total usage card */
  .usage {
    background: var(--surface);
    border-radius: var(--card-radius);
    padding: 18px 20px;
    margin-top: 12px;
    box-shadow: 0 4px 14px rgba(34, 34, 48, 0.04);
  }
  .usage .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .usage .head .left { font-size: 14px; color: var(--text-secondary); font-weight: 500; }
  .usage .head .right { font-size: 11px; color: var(--text-tertiary); }
  .usage .used-row {
    display: flex; align-items: baseline; gap: 6px;
    margin-bottom: 14px;
  }
  .usage .used-row .big { font-size: 26px; font-weight: 700; color: var(--text-primary); }
  .usage .used-row .unit { font-size: 13px; color: var(--text-secondary); }
  .usage .used-row .sep { color: var(--text-tertiary); margin: 0 4px; }
  .usage .used-row .total { font-size: 13px; color: var(--text-secondary); }
  .bar {
    height: 8px;
    background: var(--surface-strong);
    border-radius: var(--pill-radius);
    overflow: hidden;
  }
  .bar > div {
    height: 100%;
    background: linear-gradient(90deg, var(--primary) 0%, #7886F8 100%);
    border-radius: var(--pill-radius);
  }
  .bar-gray > div { background: #C9C5D4; }
  /* Storage cards */
  .storage-list { display: flex; flex-direction: column; gap: 10px; }
  .storage {
    background: var(--surface);
    border-radius: var(--card-radius);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 4px 14px rgba(34, 34, 48, 0.04);
  }
  .storage .row1 { display: flex; align-items: center; gap: 12px; }
  .storage .icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--folder-tint);
    color: var(--folder-icon);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .storage .icon.cloud { background: #E0EAFE; color: #2B58E0; }
  .storage .icon.fail { background: var(--error-container); color: var(--error-text); }
  .storage .center { flex: 1; min-width: 0; }
  .storage .path { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .storage .driver { font-size: 11.5px; color: var(--text-tertiary); margin-top: 2px; }
  .storage .badge {
    font-size: 10.5px;
    padding: 3px 8px;
    border-radius: var(--pill-radius);
    font-weight: 600;
    flex-shrink: 0;
  }
  .badge.ok { background: var(--success-container); color: var(--success-text); }
  .badge.warn { background: var(--warning-container); color: var(--warning-text); }
  .badge.fail { background: var(--error-container); color: var(--error-text); }
  .storage .row2 { display: flex; align-items: center; gap: 12px; }
  .storage .row2 .text { font-size: 12px; color: var(--text-secondary); flex: 1; }
  .storage .row2 .pct { font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .storage .bar { flex: 1; }
  /* Bottom bar */
  .bottombar {
    display: flex;
    justify-content: space-around;
    padding: 8px 14px 18px;
    background: var(--bg);
    border-top: 1px solid var(--outline);
  }
  .bb-item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px;
    border-radius: 14px;
  }
  .bb-icon {
    width: 46px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px;
    font-size: 16px;
    color: var(--text-secondary);
  }
  .bb-icon.selected { background: var(--primary-soft); color: var(--primary); }
  .bb-label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
  .bb-label.selected { color: var(--text-primary); font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span>●●●●● 5G ▰</span>
  </div>

  <div class="topbar">
    <div class="icon-btn">‹</div>
    <div class="titles">
      <div class="title">首页</div>
      <div class="subtitle">http://192.168.1.10:5244</div>
    </div>
    <div class="right-icon">⟳</div>
  </div>

  <div class="content">
    <!-- HERO -->
    <div class="hero">
      <div class="label">当前服务器</div>
      <div class="server-name">我的家庭云</div>
      <div class="meta">
        <span class="pill">v3.25.0</span>
        <span>·</span>
        <span>已运行 3 天 4 小时</span>
      </div>
    </div>

    <!-- TOTAL USAGE -->
    <div class="section-title">总用量</div>
    <div class="usage">
      <div class="head">
        <div class="left">所有存储合计</div>
        <div class="right">24%</div>
      </div>
      <div class="used-row">
        <span class="big">35.0 GB</span>
        <span class="sep">/</span>
        <span class="total">147 GB</span>
      </div>
      <div class="bar"><div style="width:24%"></div></div>
    </div>

    <!-- STORAGE LIST -->
    <div class="section-title">存储 (3)</div>
    <div class="storage-list">

      <div class="storage">
        <div class="row1">
          <div class="icon">📁</div>
          <div class="center">
            <div class="path">/local</div>
            <div class="driver">本机存储 · Local</div>
          </div>
          <div class="badge ok">正常</div>
        </div>
        <div class="row2">
          <div class="bar"><div style="width:24%"></div></div>
          <div class="pct">12.4/50 GB</div>
        </div>
      </div>

      <div class="storage">
        <div class="row1">
          <div class="icon cloud">☁</div>
          <div class="center">
            <div class="path">/aliyun</div>
            <div class="driver">阿里云盘 · Aliyundrive</div>
          </div>
          <div class="badge ok">正常</div>
        </div>
        <div class="row2">
          <div class="bar"><div style="width:2%"></div></div>
          <div class="pct">2.1/100 GB</div>
        </div>
      </div>

      <div class="storage">
        <div class="row1">
          <div class="icon fail">!</div>
          <div class="center">
            <div class="path">/quark</div>
            <div class="driver">夸克网盘 · Quark</div>
          </div>
          <div class="badge fail">异常</div>
        </div>
        <div class="row2">
          <div class="bar bar-gray"><div style="width:0%"></div></div>
          <div class="pct">—</div>
        </div>
      </div>

    </div>
  </div>

  <div class="bottombar">
    <div class="bb-item">
      <div class="bb-icon selected">⌂</div>
      <div class="bb-label selected">首页</div>
    </div>
    <div class="bb-item">
      <div class="bb-icon">▤</div>
      <div class="bb-label">文件</div>
    </div>
    <div class="bb-item">
      <div class="bb-icon">⇅</div>
      <div class="bb-label">传输</div>
    </div>
    <div class="bb-item">
      <div class="bb-icon">⚙</div>
      <div class="bb-label">设置</div>
    </div>
  </div>
</div>
</body>
</html>
